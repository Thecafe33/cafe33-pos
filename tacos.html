<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>In Tem · Tacos Óc Eo</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Display:wght@500;700&family=Google+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--gr:#1e5637;--gr-c:#e6f0ea;--gr-d:#123c26;--cay:#d93025;--cay-c:#fce8e6;--ngot:#e8710a;--ngot-c:#fef1e6;--pm:#b8860b;--pm-c:#fdf6e0;--pmcay:#b2470e;--pmcay-c:#fdece1;--surf:#fff;--surf1:#f7f8f6;--out:#dadce0;--out2:#e8eaed;--ink:#202124;--ink2:#5f6368;--ink3:#80868b;--r12:12px;--r16:16px;--r99:99px;--sh1:0 1px 3px rgba(30,86,55,.12),0 1px 2px rgba(30,86,55,.08);--sh2:0 2px 8px rgba(30,86,55,.16),0 1px 4px rgba(30,86,55,.1);--sh3:0 8px 24px rgba(30,86,55,.22),0 2px 8px rgba(30,86,55,.12);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Google Sans',sans-serif;background:var(--surf1);color:var(--ink);min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.header{background:var(--surf);border-bottom:1px solid var(--out);padding:0 16px;height:60px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.h-icon{width:36px;height:36px;background:var(--gr-c);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.h-icon img{width:100%;height:100%;object-fit:cover;}
.h-title{font-family:'Google Sans Display',sans-serif;font-size:17px;font-weight:600;line-height:1;}
.h-sub{font-size:11px;color:var(--ink3);margin-top:1px;}
.h-pill{margin-left:auto;display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--r99);font-size:12px;font-weight:500;white-space:nowrap;}
.h-pill.dis{background:var(--cay-c);color:var(--cay);}.h-pill.con{background:var(--gr-c);color:var(--gr);}.h-pill.ing{background:var(--ngot-c);color:var(--ngot);}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.sdot.r{background:var(--cay);}.sdot.g{background:var(--gr);animation:blink 2s infinite;}.sdot.y{background:var(--ngot);animation:blink .5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.body{padding:14px 14px 110px;display:flex;flex-direction:column;gap:10px;}
.sec{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gr);padding:0 4px;margin-top:6px;display:flex;align-items:center;gap:8px;}
.sec::after{content:'';flex:1;height:1px;background:var(--out);}
.card{background:var(--surf);border:1px solid var(--out);border-radius:var(--r16);overflow:hidden;box-shadow:var(--sh1);}
.ble-card{background:linear-gradient(135deg,#1e5637,#123c26);border:none;border-radius:var(--r16);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh2);}
.ble-top{display:flex;align-items:center;gap:12px;}
.ble-ico{width:46px;height:46px;background:rgba(255,255,255,.15);border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ble-ico svg{width:24px;height:24px;fill:#fff;}
.ble-name{font-size:16px;font-weight:600;color:#fff;}.ble-mac{font-family:'Google Sans Mono',monospace;font-size:11px;color:rgba(255,255,255,.65);margin-top:2px;}
.ble-desc{font-size:13px;color:rgba(255,255,255,.8);line-height:1.5;}
.btn-ble{width:100%;height:48px;border-radius:var(--r12);border:none;background:rgba(255,255,255,.95);color:var(--gr-d);font-family:'Google Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.btn-ble:active{transform:scale(.97);}.btn-ble:disabled{opacity:.6;cursor:not-allowed;}
.btn-ble.on{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35);}
.prog-wrap{width:100%;height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;display:none;}
.prog-wrap.show{display:block;}
.prog-bar{height:100%;background:#fff;border-radius:2px;width:0%;transition:width .2s;}

.field{padding:14px 16px;border-bottom:1px solid var(--out);}
.field:last-child{border-bottom:none;}
.f-label{font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:8px;display:block;}
.f-input{width:100%;height:44px;border:1.5px solid var(--out);border-radius:var(--r12);padding:0 14px;font-family:'Google Sans',sans-serif;font-size:15px;color:var(--ink);background:var(--surf1);outline:none;transition:border-color .15s;}
.f-input:focus{border-color:var(--gr);background:var(--surf);}
.f-textarea{width:100%;min-height:56px;border:1.5px solid var(--out);border-radius:var(--r12);padding:10px 14px;font-family:'Google Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--surf1);outline:none;resize:vertical;transition:border-color .15s;}
.f-textarea:focus{border-color:var(--gr);background:var(--surf);}

.chip-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
.chip{min-height:44px;display:inline-flex;align-items:center;padding:10px 18px;border-radius:var(--r99);border:1.5px solid var(--out);background:var(--surf1);font-family:'Google Sans',sans-serif;font-size:14.5px;font-weight:500;color:var(--ink2);cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent;}
.chip:active{transform:scale(.96);}
.chip.active{background:var(--gr-c);border-color:var(--gr);color:var(--gr-d);}
.chip.note.active{background:var(--ngot-c);border-color:var(--ngot);color:#a35400;}

.vi-row{display:flex;gap:12px;flex-wrap:wrap;}
.vi-btn{flex:1 1 calc(50% - 6px);min-width:130px;height:56px;border-radius:var(--r12);border:1.5px solid var(--out);background:var(--surf1);font-family:'Google Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink2);-webkit-tap-highlight-color:transparent;}
.vi-btn:active{transform:scale(.97);}
.vi-btn.cay.active{background:var(--cay-c);border-color:var(--cay);color:var(--cay);}
.vi-btn.ngot.active{background:var(--ngot-c);border-color:var(--ngot);color:var(--ngot);}
.vi-btn.pm.active{background:var(--pm-c);border-color:var(--pm);color:var(--pm);}
.vi-btn.pmcay.active{background:var(--pmcay-c);border-color:var(--pmcay);color:var(--pmcay);}
.vi-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5;}
.vi-btn.active .vi-dot{opacity:1;}

.pv-head{padding:12px 16px;border-bottom:1px solid var(--out);display:flex;align-items:center;justify-content:space-between;}
.pv-title{font-size:13px;font-weight:600;color:var(--ink2);}.pv-sub{font-size:11px;color:var(--ink3);font-family:'Google Sans Mono',monospace;}
.pv-body{padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;background:linear-gradient(135deg,#f7f8f6,#fff);}
.prt-top{width:200px;background:linear-gradient(180deg,#f1f3f4,#e8eaed);border:1.5px solid #dadce0;border-radius:16px 16px 4px 4px;padding:12px 16px 8px;box-shadow:var(--sh1),inset 0 1px 0 rgba(255,255,255,.8);}
.prt-slot{height:3px;background:#202124;border-radius:2px;margin:0 6px 8px;}
.prt-row{display:flex;justify-content:space-between;align-items:center;}
.prt-brand{font-family:'Google Sans Mono',monospace;font-size:8px;letter-spacing:.1em;color:#80868b;}
.prt-leds{display:flex;gap:4px;}
.led{width:6px;height:6px;border-radius:50%;}
.led.on{background:var(--gr);box-shadow:0 0 4px var(--gr);animation:blink 2s infinite;}
.led.con{background:#1a73e8;box-shadow:0 0 4px #1a73e8;animation:blink .8s infinite;}
.led.off{background:#dadce0;}
.paper-canvas-wrap{background:#fff;border-radius:0 0 4px 4px;box-shadow:0 4px 12px rgba(30,86,55,.16);border:1px solid #e8eaed;border-top:none;overflow:hidden;}
#previewCanvas{display:block;image-rendering:pixelated;}
.printing #previewCanvas{animation:pfeed .3s ease;}
@keyframes pfeed{from{transform:translateY(-6px);opacity:0}to{transform:translateY(0);opacity:1}}

.log-card{background:#14231a;border:1px solid #24402f;border-radius:var(--r16);overflow:hidden;}
.log-head{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #24402f;}
.log-title{font-size:11px;font-weight:600;color:#7fd9a5;letter-spacing:.06em;text-transform:uppercase;}
.log-clear{font-size:11px;color:#6c8a76;cursor:pointer;padding:4px 8px;border-radius:6px;border:none;background:none;}
.log-body{padding:10px 14px;max-height:130px;overflow-y:auto;font-family:'Google Sans Mono',monospace;font-size:11px;line-height:1.7;}
.ll{color:#a0c0a8;}.ll.ok{color:#4ade80;}.ll.err{color:#f87171;}.ll.info{color:#60a5fa;}.ll.warn{color:#fbbf24;}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--out);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:100;box-shadow:0 -4px 16px rgba(30,86,55,.08);}
.fab-main{flex:1;height:52px;border-radius:var(--r16);background:var(--gr);color:#fff;border:none;font-family:'Google Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--sh2);transition:all .15s;}
.fab-main svg{width:20px;height:20px;fill:#fff;}
.fab-main:active{transform:scale(.97);}.fab-main:disabled{background:var(--out2);color:var(--ink3);box-shadow:none;cursor:not-allowed;}
.fab-main:disabled svg{fill:var(--ink3);}

.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(16px);background:#202124;color:#fff;padding:10px 20px;border-radius:var(--r99);font-size:13px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:200;box-shadow:var(--sh3);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@keyframes sup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card,.ble-card,.log-card{animation:sup .25s ease both;}
.req::after{content:' *';color:var(--cay);}
</style>
</head>

// Vị có phô mai (phomai / phomaicay) sẽ tự cộng thêm 5K vào giá khách chọn/nhập
function computeDisplayPrice(baseStr, vi) {
  if (!baseStr) return '';
  if (vi !== 'phomai' && vi !== 'phomaicay') return baseStr;
  const m = baseStr.match(/(\d+(?:[.,]\d+)?)/);
  if (!m) return baseStr;
  let num = parseFloat(m[1].replace(',', '.')) + 5;
  const numStr = Number.isInteger(num) ? String(num) : num.toFixed(1);
  const suffix = baseStr.slice(m.index + m[1].length) || 'K';
  const prefix = baseStr.slice(0, m.index);
  return prefix + numStr + suffix;
}

// ── Build chip UI ──
function buildChips() {
  const cP = document.getElementById('chipPhanLoai');
  PHAN_LOAI_PRESETS.forEach(p => {
    const c = document.createElement('div');
    c.className = 'chip'; c.textContent = p;
    c.onclick = () => { document.getElementById('inPhanLoai').value = p;
      [...cP.children].forEach(x=>x.classList.remove('active')); c.classList.add('active');
      updatePreviewCanvas(); };
    cP.appendChild(c);
  });
  const cGia = document.getElementById('chipGia');
  GIA_PRESETS.forEach(g => {
    const c = document.createElement('div');
    c.className = 'chip'; c.textContent = g;
    c.onclick = () => {
      document.getElementById('inGia').value = g;
      [...cGia.children].forEach(x=>x.classList.remove('active')); c.classList.add('active');
      updatePreviewCanvas();
    };
    cGia.appendChild(c);
  });
  const cG = document.getElementById('chipGhiChu');
  GHI_CHU_PRESETS.forEach(g => {
    const c = document.createElement('div');
    c.className = 'chip note'; c.textContent = g;
    c.onclick = () => {
      if (selectedGhiChu.has(g)) { selectedGhiChu.delete(g); c.classList.remove('active'); }
      else { selectedGhiChu.add(g); c.classList.add('active'); }
      updatePreviewCanvas();
    };
    cG.appendChild(c);
  });
}
buildChips();

// ── Text wrap helper cho canvas ──
function computeLines(ctx, text, maxWidth) {
  const words = text.split(' ');
  let line = '', lines = [];
  for (let n = 0; n < words.length; n++) {
    const test = line + words[n] + ' ';
    if (ctx.measureText(test).width > maxWidth && line !== '') {
      lines.push(line); line = words[n] + ' ';
    } else { line = test; }
  }
  lines.push(line);
  return lines;
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines, align) {
  const words = text.split(' ');
  let line = '', lines = [];
  for (let n = 0; n < words.length; n++) {
    const test = line + words[n] + ' ';
    if (ctx.measureText(test).width > maxWidth && line !== '') {
      lines.push(line); line = words[n] + ' ';
    } else { line = test; }
  }
  lines.push(line);
  if (maxLines && lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    lines[maxLines-1] = lines[maxLines-1].trim() + '…';
  }
  if (align === 'center') {
    ctx.textAlign = 'center';
    lines.forEach((l,i) => ctx.fillText(l.trim(), x + maxWidth/2, y + i*lineHeight));
    ctx.textAlign = 'left';
  } else {
    lines.forEach((l,i) => ctx.fillText(l.trim(), x, y + i*lineHeight));
  }
  return lines.length;
}

// ── Vẽ tem lên canvas (320x240, dùng chung cho preview & in) ──
// Bố cục: Logo + Tên món + Vị đi chung 1 khối GỌN phía trên (chỉ cần nhận diện món).
// Khách hàng (trái) / Giờ nhận (phải) chia 2 ô rõ ràng, tận dụng cả 2 bên tem.
// Ghi chú full-width bên dưới. In nhiệt 1-bit -> không nền tô màu, không chữ nghiêng.
function fitFontSize(ctx, text, maxW, startSize, minSize, weight) {
  let size = startSize;
  while (size > minSize) {
    ctx.font = weight + ' ' + size + 'px "Google Sans", sans-serif';
    if (ctx.measureText(text).width <= maxW) break;
    size -= 1;
  }
  ctx.font = weight + ' ' + size + 'px "Google Sans", sans-serif';
  return size;
}

// Ghi chú cho máy in nhiệt (thermal): mọi màu đều bị quy về đen/trắng qua ngưỡng
// (THRESHOLD), nên bố cục dựa vào KHỐI - ĐƯỜNG KẺ ĐẬM - CHỮ BOLD thay vì màu sắc.
// Đường kẻ mảnh (1px) rất dễ bị mất nét ở đầu in nhiệt 203dpi => tối thiểu 2px.
// Chữ tối thiểu ~13-14px để không bị nhòe khi in ở khổ 40mm.
function drawLabel(ctx) {
  ctx.clearRect(0,0,LABEL_W,LABEL_H);
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,LABEL_W,LABEL_H);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';

  const pad = 12; // lề rộng — tránh mất chữ do lệch giấy/đầu in
  const fullW = LABEL_W - pad*2;

  const phanLoai = document.getElementById('inPhanLoai').value.trim() || '—';
  const giaBase  = document.getElementById('inGia').value.trim();
  const gia      = computeDisplayPrice(giaBase, selectedVi); // tự +5K nếu vị có phô mai
  const tenKhach = document.getElementById('inTenKhach').value.trim();
  const gioNhan  = document.getElementById('inGioNhan').value.trim();
  const ghiChuCustom = document.getElementById('inGhiChuCustom').value.trim();
  const ghiChuFull = [...selectedGhiChu, ghiChuCustom].filter(Boolean).join(', ');

  // ═══ KHỐI 1: Logo + Tên món (to) + Vị (to) bên trái — Giá to & căn giữa cả khối bên phải ═══
  const logoW = 44, logoH = 58;
  if (logoImg.complete && logoImg.naturalWidth) {
    ctx.drawImage(logoImg, pad, pad, logoW, logoH);
  }
  const colX = pad + logoW + 12;
  // Dành sẵn 1 vùng cho ô Giá bên phải (nếu có) để tên món/vị co lại vừa khít, không đè lên nhau
  const priceAreaW = gia ? 92 : 0;
  const colW = LABEL_W - pad - colX - (gia ? priceAreaW + 10 : 0);

  // Tên món — to rõ, chiếm hết chiều rộng còn lại (sau khi trừ vùng giá)
  const plSize = fitFontSize(ctx, phanLoai, colW, 32, 18, '700');
  ctx.fillStyle = '#000';
  ctx.fillText(phanLoai, colX, pad + plSize);

  // Vị — ngay dưới tên món, cùng cột trái, tên vị hiển thị đầy đủ (Cay/Ngọt/Phô mai/Phô mai cay)
  const rowY = pad + plSize + 8;
  let viSize = 0;
  if (selectedVi) {
    const VI_LABEL = { cay: '● CAY', ngot: '● NGỌT', phomai: '● PHÔ MAI', phomaicay: '● PHÔ MAI CAY' };
    const label = VI_LABEL[selectedVi] || '';
    viSize = fitFontSize(ctx, label, colW, 26, 14, '700');
    ctx.font = '700 ' + viSize + 'px "Google Sans", sans-serif';
    ctx.fillStyle = '#000';
    ctx.fillText(label, colX, rowY + viSize);
  }

  // Chiều cao toàn khối (Tên món + Vị, hoặc Logo nếu cao hơn) — Giá sẽ to & căn giữa đúng bằng khối này
  const logoBottom = pad + logoH;
  const nameViBottom = selectedVi ? (rowY + viSize) : (pad + plSize);
  const headerTop = pad - 3;
  const headerBottom = Math.max(logoBottom, nameViBottom) + 3;
  const headerH = headerBottom - headerTop;

  if (gia) {
    const boxW = priceAreaW;
    const pbX = LABEL_W - pad - boxW;
    const pbY = headerTop;
    ctx.fillStyle = '#fff';
    ctx.fillRect(pbX, pbY, boxW, headerH);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2.4;
    ctx.strokeRect(pbX, pbY, boxW, headerH);
    // Chữ giá to hết mức trong khung — bị giới hạn bởi cả bề rộng lẫn bề cao của khung
    const priceSize = fitFontSize(ctx, gia, boxW - 14, headerH - 12, 16, '700');
    ctx.font = '700 ' + priceSize + 'px "Google Sans", sans-serif';
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.fillText(gia, pbX + boxW/2, pbY + headerH/2 + priceSize*0.35);
    ctx.textAlign = 'left';
  }

  let y = headerBottom + 12;

  // Đường kẻ đậm phân tách khối món / khối khách
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(LABEL_W-pad, y); ctx.stroke();
  y += 10;

  // ═══ KHỐI 2: Khách hàng (trái) | Giờ nhận (phải) — không nhãn, chữ nhỏ gọn hơn ═══
  const rowTop = y;
  const colGap = 18;
  const halfW = (fullW - colGap) / 2;
  const leftX = pad;
  const rightX = pad + halfW + colGap;

  const khVal  = tenKhach || '—';
  const gioVal = gioNhan || '—';
  const sizeKh  = fitFontSize(ctx, khVal, halfW, 17, 12, '700');
  const sizeGio = fitFontSize(ctx, gioVal, halfW, 17, 12, '700');
  const rowSize = Math.min(sizeKh, sizeGio, 16);

  ctx.font = '700 ' + rowSize + 'px "Google Sans", sans-serif';
  ctx.fillStyle = '#000';
  ctx.fillText(khVal, leftX, rowTop + rowSize);
  ctx.fillText(gioVal, rightX, rowTop + rowSize);

  // Vạch ngăn dọc giữa 2 ô
  const midX = pad + halfW + colGap/2;
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(midX, rowTop - 4); ctx.lineTo(midX, rowTop + rowSize + 6); ctx.stroke();

  y = rowTop + rowSize + 10;

  // Đường kẻ ngang trước Ghi chú
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(LABEL_W-pad, y); ctx.stroke();
  y += 16;

  // Footer to hơn, đậm hơn — thông tin quan trọng, chữ nhỏ dễ nhoè khi in nhiệt
  const footerLineH = 17;
  ctx.font = '700 13px "Google Sans", sans-serif';
  const footerLines = computeLines(ctx, FOOTER_NOTE, fullW);
  // Vị trí neo đáy — chỉ dùng làm GIỚI HẠN AN TOÀN, đảm bảo footer không bao giờ bị đẩy tràn ra ngoài tem
  const safeMaxDividerY = ((LABEL_H - 6) - (footerLines.length - 1) * footerLineH) - 18;

  // ═══ KHỐI 3: Ghi chú — không có nhãn tiêu đề ═══
  if (ghiChuFull) {
    ctx.font = '600 14px "Google Sans", sans-serif';
    ctx.fillStyle = '#000';
    const ghiChuLineH = 18;
    const availGhiChuH = (safeMaxDividerY - 6) - y;
    const maxGhiChuLines = Math.max(1, Math.floor(availGhiChuH / ghiChuLineH));
    const usedLines = wrapText(ctx, ghiChuFull, pad, y, fullW, ghiChuLineH, maxGhiChuLines);
    y += ghiChuLineH * usedLines;
  }

  // Đường kẻ trước footer — bám sát ngay sau nội dung thực tế (không còn khoảng trắng thừa),
  // đồng thời không bao giờ vượt quá vị trí an toàn ở đáy tem
  const dividerY = Math.min(y + 10, safeMaxDividerY);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(pad, dividerY); ctx.lineTo(LABEL_W-pad, dividerY); ctx.stroke();

  // ── Footer: to, đậm, căn giữa — luôn hiển thị đầy đủ, không bị cắt "…" ──
  const footerFirstY = dividerY + 18;
  ctx.font = '700 13px "Google Sans", sans-serif';
  ctx.fillStyle = '#000';
  wrapText(ctx, FOOTER_NOTE, pad, footerFirstY, fullW, footerLineH, undefined, 'center');
}

function updatePreviewCanvas() {
  const cv = document.getElementById('previewCanvas');
  const ctx = cv.getContext('2d');
  drawLabel(ctx);
  document.getElementById('pvInfo').textContent = LABEL_W+'×'+LABEL_H+'px';
}

// ── BLE ──
async function toggleBle(){if(isConn)await disconnectBle();else await connectBle();}
async function connectBle(){
  if(!navigator.bluetooth){toast('Cần Chrome Android');log('Web Bluetooth không khả dụng','err');return;}
  const btn=document.getElementById('btnBle');
  btn.disabled=true;
  btn.innerHTML='<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:var(--gr-d)"><path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/></svg> Đang tìm...';
  setStatus('ing','Đang kết nối...');setProgress(10);
  log('Quét BLE...','info');
  try{
    bleDevice=await navigator.bluetooth.requestDevice({
      filters:[{name:'MP583'},{namePrefix:'MP583'}],
      optionalServices:[SVC,SVC2],
    });
    log('Tìm thấy: '+bleDevice.name,'ok');setProgress(35);
    const server=await bleDevice.gatt.connect();
    log('GATT OK','ok');setProgress(55);
    let char=null;
    try{
      const svc=await server.getPrimaryService(SVC);
      const chars=await svc.getCharacteristics();
      for(const c of chars){
        log('Char: '+c.uuid.slice(0,8)+' WNR='+c.properties.writeWithoutResponse,'info');
        if(c.properties.writeWithoutResponse||c.properties.write) char=char||c;
      }
      if(char) log('SPP 49535343 OK','ok');
    }catch(e){
      log('SPP fail, thử 0x18F0...','warn');
      try{
        const svc2=await server.getPrimaryService(SVC2);
        const chars=await svc2.getCharacteristics();
        for(const c of chars){if(c.properties.writeWithoutResponse||c.properties.write) char=char||c;}
        if(char) log('0x18F0 OK','ok');
      }catch(e2){log('Lỗi: '+e2.message,'err');}
    }
    if(!char)throw new Error('Không tìm thấy writable characteristic');
    bleChar=char;isConn=true;setProgress(100);setTimeout(()=>setProgress(null),500);
    log('Sẵn sàng in · WNR='+char.properties.writeWithoutResponse,'ok');
    setStatus('con','Đã kết nối');
    document.getElementById('bleDesc').textContent='Đã kết nối. In trực tiếp GS v0 — 320×240px.';
    btn.disabled=false;btn.className='btn-ble on';
    btn.innerHTML='<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#fff"><path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/></svg> Ngắt kết nối';
    document.getElementById('ledConn').className='led con';
    checkReady();
    toast('Đã kết nối '+bleDevice.name);
    bleDevice.addEventListener('gattserverdisconnected',onDis);
  }catch(e){
    log('Lỗi: '+e.message,'err');toast('Lỗi: '+e.message,3500);
    setStatus('dis','Chưa kết nối');setProgress(null);
    btn.disabled=false;btn.className='btn-ble';
    btn.innerHTML='<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:var(--gr-d)"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg> Thử lại';
  }
}
function onDis(){
  isConn=false;bleChar=null;log('Mất kết nối','err');setStatus('dis','Mất kết nối');
  const btn=document.getElementById('btnBle');btn.className='btn-ble';btn.disabled=false;
  btn.innerHTML='<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:var(--gr-d)"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg> Kết nối lại';
  document.getElementById('ledConn').className='led off';
  document.getElementById('btnPrint').disabled=true;
  toast('Mất kết nối');
}
async function disconnectBle(){if(bleDevice?.gatt?.connected)bleDevice.gatt.disconnect();onDis();}

// ── ESC/POS raster từ canvas 320x240 ──
async function labelToEscPos() {
  const cv = document.createElement('canvas');
  cv.width = LABEL_W; cv.height = LABEL_H;
  const ctx = cv.getContext('2d');
  drawLabel(ctx);

  // Đặt tem (320px) vào buffer giấy đầy đủ (paperW=384 dots), canh giữa + fine-tune
  const finalOffMM = autoOffMM + offVal;
  const offDots = Math.round(Math.max(0, finalOffMM) * MM2PX);

  const full = document.createElement('canvas');
  full.width = paperW; full.height = LABEL_H;
  const fctx = full.getContext('2d');
  fctx.fillStyle = '#fff'; fctx.fillRect(0,0,paperW,LABEL_H);
  fctx.drawImage(cv, offDots, 0);

  log('off='+finalOffMM.toFixed(1)+'mm ('+offDots+'dots) | label='+LABEL_W+'x'+LABEL_H+'px','info');

  const id = fctx.getImageData(0, 0, paperW, LABEL_H);
  const px = id.data;
  const gray = new Float32Array(paperW * LABEL_H);
  for (let i = 0; i < paperW * LABEL_H; i++) {
    gray[i] = 0.299*px[i*4] + 0.587*px[i*4+1] + 0.114*px[i*4+2];
  }

  // Contrast boost (cố định 50)
  const factor = (259 * (CONTRAST + 255)) / (255 * (259 - CONTRAST));
  for (let i = 0; i < gray.length; i++) {
    gray[i] = Math.max(0, Math.min(255, factor * (gray[i] - 128) + 128));
  }

  // GS v 0 raster bitmap
  const bpr = Math.ceil(paperW / 8);
  const bytes = [];
  bytes.push(0x1B, 0x40);        // ESC @ reset
  bytes.push(0x1B, 0x33, 0x00);  // line spacing 0
  bytes.push(0x1D, 0x76, 0x30, GS_MODE);
  bytes.push(bpr & 0xFF, (bpr >> 8) & 0xFF);
  bytes.push(LABEL_H & 0xFF, (LABEL_H >> 8) & 0xFF);

  for (let y = 0; y < LABEL_H; y++) {
    for (let bx = 0; bx < bpr; bx++) {
      let b = 0;
      for (let bit = 0; bit < 8; bit++) {
        const x = bx * 8 + bit;
        if (x < paperW && gray[y * paperW + x] < THRESHOLD) b |= (0x80 >> bit);
      }
      bytes.push(b);
    }
  }

  // Feed cố định 6mm
  let rem = Math.round(GAP_MM * MM2PX);
  while(rem > 0){ const n=Math.min(255,rem); bytes.push(0x1B,0x4A,n); rem-=n; }

  log('GS v0 mode='+GS_MODE+': '+bpr+'bpr × '+LABEL_H+'rows = '+bytes.length+' bytes','ok');
  return new Uint8Array(bytes);
}

// ── BLE write chunked ──
async function writeBle(data) {
  const CHUNK = 128;
  const useWoR = bleChar.properties.writeWithoutResponse;
  let sent = 0;
  while (sent < data.length) {
    const chunk = data.slice(sent, sent + CHUNK);
    try {
      if (useWoR) await bleChar.writeValueWithoutResponse(chunk);
      else        await bleChar.writeValue(chunk);
    } catch(e) {
      await new Promise(r => setTimeout(r, 80));
      if (useWoR) await bleChar.writeValueWithoutResponse(chunk);
      else        await bleChar.writeValue(chunk);
    }
    sent += CHUNK;
    setProgress(Math.round(sent / data.length * 100));
    await new Promise(r => setTimeout(r, 30));
  }
}

async function doPrint() {
  if (!checkReady()) { toast('Điền đủ Phân loại / Vị / Tên khách!'); return; }
  if (!isConn)  { toast('Chưa kết nối!');    return; }
  const btn = document.getElementById('btnPrint');
  btn.disabled = true;
  btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#aaa"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg> Đang in...';
  log('=== BẮT ĐẦU IN ===','info'); setProgress(5);
  try {
    const data = await labelToEscPos();
    setProgress(25);
    await writeBle(data);
    setProgress(100); setTimeout(() => setProgress(null), 500);
    log('In xong!', 'ok'); toast('In thành công!');
    const w = document.getElementById('paperWrap');
    w.classList.add('printing'); setTimeout(() => w.classList.remove('printing'), 400);
  } catch(e) {
    log('Lỗi: ' + e.message, 'err'); toast('Lỗi: ' + e.message, 3500); setProgress(null);
  }
  btn.disabled = false;
  checkReady();
  btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#fff"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg> In tem ngay';
}
